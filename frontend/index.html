<!DOCTYPE html>
<html lang="en">

<head>
    <title>Spring Note</title>
    <!-- Link CSS -->
    <link rel="stylesheet" href="./css/style.css">
    <!-- Favicon-->
     <link rel="icon" type="image/png" href="./assets/note.ico">
</head>

<body>
    <div id="sidePanel" class="side-panel">
        <div class="panel-tab" id="panelToggle">☰</div>
        <div class="panel-content">
            <div id="newBoardBtn" class="board-item" style="color: #00bcd4; cursor: pointer;">
                <h3>+ New Board</h3>
            </div>
            <hr>
            <h3 id="boardListToggle" style="cursor: pointer;">Your boards ▲</h3>
            <ul id="boardList"></ul>
        </div>
    </div>

    <div id="statusIndicator"></div>

    <header>
        <h1>Spring Note</h1>
        <p>Welcome to your digital bulletin board!</p>
    </header>

    <hr>

    <div id="bulletinBoard" class="board-canvas">
        </div>


    <div id="boardContextMenu" class="dropdown" style="position: fixed; display: none;">
        <div class="dropdown-item" id="ctxAddNote">Add Note</div>
    </div>

    <script src="./script.js"></script>

</body>
</html>
